version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=DeltaGrid
      - DEBUG=false
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      - CACHE_TTL_SECONDS=60
      - DATABASE_URL=sqlite:///./deltagrid.db
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
