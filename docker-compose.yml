services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=deltagrid
      - POSTGRES_USER=deltagrid
      - POSTGRES_PASSWORD=deltagrid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltagrid -d deltagrid"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=DeltaGrid
      - DEBUG=${DEBUG:-true}
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      - COINGLASS_API_KEY=${COINGLASS_API_KEY:-}
      - COINGLASS_STANDARD_API_KEY=${COINGLASS_STANDARD_API_KEY:-}
      - CACHE_TTL_SECONDS=60
      - DATABASE_URL=postgresql://deltagrid:deltagrid@postgres:5432/deltagrid
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - DATABASE_POOL_TIMEOUT_SECONDS=${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      - SECRET_KEY=${SECRET_KEY:-local-dev-secret-change-me}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY:-}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_INTERNAL_URL=http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - BACKEND_FETCH_TIMEOUT_MS=${BACKEND_FETCH_TIMEOUT_MS:-5000}
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
