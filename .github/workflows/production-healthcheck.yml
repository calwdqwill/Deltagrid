name: Production Healthcheck

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: production-healthcheck
  cancel-in-progress: false

jobs:
  healthcheck:
    name: Check production endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check backend health
        run: |
          curl --fail --show-error --silent --max-time 20 \
            https://deltagrid.pro/api/v1/health >/tmp/health.json
          cat /tmp/health.json

      - name: Check backend readiness
        run: |
          curl --fail --show-error --silent --max-time 20 \
            https://deltagrid.pro/api/v1/health/readiness >/tmp/readiness.json
          cat /tmp/readiness.json

      - name: Check data health
        run: |
          curl --fail --show-error --silent --max-time 30 \
            https://deltagrid.pro/api/v1/data/health >/tmp/data-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("/tmp/data-health.json").read_text())
          if response.get("success") is not True:
              raise SystemExit("data health response is not successful")

          payload = response.get("data") or {}
          providers = payload.get("providers") or {}
          row_counts = payload.get("row_counts") or {}
          freshness = payload.get("freshness") or {}
          summary = freshness.get("summary") or {}

          print("providers:", providers)
          print("row_counts:", row_counts)
          print("freshness_summary:", summary)

          required_providers = ("okx", "coinglass", "coingecko")
          unhealthy = [
              name
              for name in required_providers
              if not (providers.get(name) or {}).get("healthy")
          ]
          if unhealthy:
              raise SystemExit(f"unhealthy required providers: {', '.join(unhealthy)}")

          if summary and summary.get("degraded", 0) > 0:
              raise SystemExit("data freshness has degraded streams")
          PY

      - name: Check frontend
        run: |
          curl --fail --show-error --silent --max-time 20 \
            https://deltagrid.pro >/tmp/frontend.html
          test -s /tmp/frontend.html
