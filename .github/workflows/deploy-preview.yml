name: Deploy Preview

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - preview
    types:
      - completed

jobs:
  deploy:
    name: Deploy preview branch
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'preview' }}
    env:
      SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
      APP_DIR: ${{ secrets.PREVIEW_APP_DIR }}
      APP_ENV_FILE: ${{ secrets.PREVIEW_ENV_FILE }}
      COMPOSE_PROJECT_NAME: ${{ secrets.PREVIEW_COMPOSE_PROJECT_NAME }}
      SMOKE_BASE_URL: ${{ secrets.PREVIEW_SMOKE_BASE_URL }}
      SMOKE_FRONTEND_URL: ${{ secrets.PREVIEW_SMOKE_FRONTEND_URL }}

    steps:
      - name: Report preview secret readiness
        run: |
          for name in SSH_HOST SSH_USER SSH_KEY APP_DIR; do
            if [ -n "${!name}" ]; then
              echo "$name configured"
            else
              echo "::warning::$name missing"
            fi
          done

      - name: Preview secret SSH_HOST configured
        if: ${{ env.SSH_HOST != '' }}
        run: echo "SSH_HOST configured"

      - name: Preview secret SSH_HOST missing
        if: ${{ env.SSH_HOST == '' }}
        run: echo "SSH_HOST missing"

      - name: Preview secret SSH_USER configured
        if: ${{ env.SSH_USER != '' }}
        run: echo "SSH_USER configured"

      - name: Preview secret SSH_USER missing
        if: ${{ env.SSH_USER == '' }}
        run: echo "SSH_USER missing"

      - name: Preview secret SSH_KEY configured
        if: ${{ env.SSH_KEY != '' }}
        run: echo "SSH_KEY configured"

      - name: Preview secret SSH_KEY missing
        if: ${{ env.SSH_KEY == '' }}
        run: echo "SSH_KEY missing"

      - name: Preview secret APP_DIR configured
        if: ${{ env.APP_DIR != '' }}
        run: echo "APP_DIR configured"

      - name: Preview secret APP_DIR missing
        if: ${{ env.APP_DIR == '' }}
        run: echo "APP_DIR missing"

      - name: Skip when preview secrets are not configured
        if: ${{ env.SSH_HOST == '' || env.SSH_USER == '' || env.SSH_KEY == '' || env.APP_DIR == '' }}
        run: echo "Preview deploy skipped because SSH secrets are not configured."

      - name: Configure SSH
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deltagrid_preview_key
          chmod 600 ~/.ssh/deltagrid_preview_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Validate preview deploy key fingerprint
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          ssh-keygen -y -f ~/.ssh/deltagrid_preview_key > ~/.ssh/deltagrid_preview_key.pub
          actual="$(ssh-keygen -lf ~/.ssh/deltagrid_preview_key.pub | awk '{print $2}')"
          expected="SHA256:TYYi5IayfvNvxRGC3K/J637w8rkUw/+5QtyvtUFJGsg"
          test "$actual" = "$expected"

      - name: Test preview SSH login
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          ssh -i ~/.ssh/deltagrid_preview_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" "echo preview ssh ok"

      - name: Check preview app directory
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          ssh -i ~/.ssh/deltagrid_preview_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" "
            set -e
            test -d '$APP_DIR'
            cd '$APP_DIR'
            test -f scripts/deploy-compose-stack.sh
            git status --short --branch
          "

      - name: Deploy preview
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          ssh -i ~/.ssh/deltagrid_preview_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$APP_DIR'
            BRANCH=preview \
              ENV_FILE='${APP_ENV_FILE:-.env.preview}' \
              COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME:-deltagrid-preview}' \
              BASE_URL='${SMOKE_BASE_URL:-http://127.0.0.1:8011}' \
              FRONTEND_URL='${SMOKE_FRONTEND_URL:-http://127.0.0.1:3012}' \
              sh scripts/deploy-compose-stack.sh
          "
