name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    name: Deploy main branch
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      APP_DIR: ${{ secrets.PROD_APP_DIR }}
      APP_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      COMPOSE_PROJECT_NAME: ${{ secrets.PROD_COMPOSE_PROJECT_NAME }}
      SMOKE_BASE_URL: ${{ secrets.PROD_SMOKE_BASE_URL }}
      SMOKE_FRONTEND_URL: ${{ secrets.PROD_SMOKE_FRONTEND_URL }}

    steps:
      - name: Skip when production secrets are not configured
        if: ${{ env.SSH_HOST == '' || env.SSH_USER == '' || env.SSH_KEY == '' || env.APP_DIR == '' }}
        run: echo "Production deploy skipped because SSH secrets are not configured."

      - name: Configure SSH
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deltagrid_prod_key
          chmod 600 ~/.ssh/deltagrid_prod_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          ssh -i ~/.ssh/deltagrid_prod_key "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$APP_DIR'
            BRANCH=main \
              ENV_FILE='${APP_ENV_FILE:-.env.production}' \
              COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME:-deltagrid}' \
              BASE_URL='${SMOKE_BASE_URL:-http://127.0.0.1:8000}' \
              FRONTEND_URL='${SMOKE_FRONTEND_URL:-http://127.0.0.1:3001}' \
              sh scripts/deploy-compose-stack.sh
          "
