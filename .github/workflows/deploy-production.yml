name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    name: Deploy main branch
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      APP_DIR: ${{ secrets.PROD_APP_DIR }}
      APP_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      COMPOSE_PROJECT_NAME: ${{ secrets.PROD_COMPOSE_PROJECT_NAME }}
      SMOKE_BASE_URL: ${{ secrets.PROD_SMOKE_BASE_URL }}
      SMOKE_FRONTEND_URL: ${{ secrets.PROD_SMOKE_FRONTEND_URL }}
      SSH_COMMON_OPTIONS: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o NumberOfPasswordPrompts=0 -o TCPKeepAlive=yes -o IPQoS=none"

    steps:
      - name: Report production secret readiness
        run: |
          for name in SSH_HOST SSH_USER SSH_KEY APP_DIR; do
            if [ -n "${!name}" ]; then
              echo "$name configured"
            else
              echo "::warning::$name missing"
            fi
          done

      - name: Production secret SSH_HOST configured
        if: ${{ env.SSH_HOST != '' }}
        run: echo "SSH_HOST configured"

      - name: Production secret SSH_HOST missing
        if: ${{ env.SSH_HOST == '' }}
        run: echo "SSH_HOST missing"

      - name: Production secret SSH_USER configured
        if: ${{ env.SSH_USER != '' }}
        run: echo "SSH_USER configured"

      - name: Production secret SSH_USER missing
        if: ${{ env.SSH_USER == '' }}
        run: echo "SSH_USER missing"

      - name: Production secret SSH_KEY configured
        if: ${{ env.SSH_KEY != '' }}
        run: echo "SSH_KEY configured"

      - name: Production secret SSH_KEY missing
        if: ${{ env.SSH_KEY == '' }}
        run: echo "SSH_KEY missing"

      - name: Production secret APP_DIR configured
        if: ${{ env.APP_DIR != '' }}
        run: echo "APP_DIR configured"

      - name: Production secret APP_DIR missing
        if: ${{ env.APP_DIR == '' }}
        run: echo "APP_DIR missing"

      - name: Skip when production secrets are not configured
        if: ${{ env.SSH_HOST == '' || env.SSH_USER == '' || env.SSH_KEY == '' || env.APP_DIR == '' }}
        run: echo "Production deploy skipped because SSH secrets are not configured."

      - name: Configure SSH
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deltagrid_prod_key
          chmod 600 ~/.ssh/deltagrid_prod_key
          ssh-keyscan -T 20 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Validate production deploy key fingerprint
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          ssh-keygen -y -f ~/.ssh/deltagrid_prod_key > ~/.ssh/deltagrid_prod_key.pub
          actual="$(ssh-keygen -lf ~/.ssh/deltagrid_prod_key.pub | awk '{print $2}')"
          expected="SHA256:TYYi5IayfvNvxRGC3K/J637w8rkUw/+5QtyvtUFJGsg"
          test "$actual" = "$expected"

      - name: Production SSH_HOST value expected
        if: ${{ env.SSH_HOST != '' && env.SSH_HOST == '2.25.143.143' }}
        run: echo "SSH_HOST matches expected VPS IP"

      - name: Production SSH_HOST value mismatch
        if: ${{ env.SSH_HOST != '' && env.SSH_HOST != '2.25.143.143' }}
        run: exit 1

      - name: Production SSH_USER value expected
        if: ${{ env.SSH_USER != '' && env.SSH_USER == 'root' }}
        run: echo "SSH_USER matches expected user"

      - name: Production SSH_USER value mismatch
        if: ${{ env.SSH_USER != '' && env.SSH_USER != 'root' }}
        run: exit 1

      - name: Production APP_DIR value expected
        if: ${{ env.APP_DIR != '' && env.APP_DIR == '/opt/deltagrid' }}
        run: echo "APP_DIR matches expected path"

      - name: Production APP_DIR value mismatch
        if: ${{ env.APP_DIR != '' && env.APP_DIR != '/opt/deltagrid' }}
        run: exit 1

      - name: Check production SSH port
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$SSH_HOST/22"; then
            echo "SSH port 22 is reachable"
          else
            echo "::warning::SSH port 22 probe failed; continuing to the SSH login check"
          fi

      - name: Test production SSH login
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Production SSH login attempt $attempt"
            if timeout 45 ssh -i ~/.ssh/deltagrid_prod_key $SSH_COMMON_OPTIONS "$SSH_USER@$SSH_HOST" "echo production ssh ok && date -u"; then
              exit 0
            fi
            echo "::warning::Production SSH login failed on attempt $attempt"
            sleep $((attempt * 15))
          done
          echo "::warning::Production SSH login diagnostic failed after retries; deploy step remains the gating SSH command"
          exit 0

      - name: Check production app directory
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          for attempt in 1 2 3; do
            echo "Production app directory check attempt $attempt"
            if timeout 60 ssh -i ~/.ssh/deltagrid_prod_key $SSH_COMMON_OPTIONS "$SSH_USER@$SSH_HOST" "
              set -e
              test -d '$APP_DIR'
              cd '$APP_DIR'
              test -f scripts/deploy-compose-stack.sh
              git status --short --branch
            "; then
              exit 0
            fi
            echo "::warning::Production app directory check failed on attempt $attempt"
            sleep $((attempt * 15))
          done
          echo "::warning::Production app directory diagnostic failed after retries; deploy step remains the gating check"
          exit 0

      - name: Deploy production
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          for attempt in 1 2 3; do
            echo "Production deploy attempt $attempt"
            if timeout 1200 ssh -i ~/.ssh/deltagrid_prod_key $SSH_COMMON_OPTIONS "$SSH_USER@$SSH_HOST" "
              set -e
              cd '$APP_DIR'
              BRANCH=main \
                ENV_FILE='${APP_ENV_FILE:-.env.production}' \
                COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME:-deltagrid}' \
                BASE_URL='${SMOKE_BASE_URL:-http://127.0.0.1:8000}' \
                FRONTEND_URL='${SMOKE_FRONTEND_URL:-http://127.0.0.1:3001}' \
                sh scripts/deploy-compose-stack.sh
            "; then
              exit 0
            fi
            echo "::warning::Production deploy failed on attempt $attempt"
            sleep $((attempt * 30))
          done
          exit 1
