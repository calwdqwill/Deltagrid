name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for the manual production deploy"
        required: false
        type: string
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    name: Deploy main branch
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      APP_DIR: ${{ secrets.PROD_APP_DIR }}
      APP_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      COMPOSE_PROJECT_NAME: ${{ secrets.PROD_COMPOSE_PROJECT_NAME }}
      SMOKE_BASE_URL: ${{ secrets.PROD_SMOKE_BASE_URL }}
      SMOKE_FRONTEND_URL: ${{ secrets.PROD_SMOKE_FRONTEND_URL }}
      EXPECTED_SSH_HOST: "2.25.143.143"
      EXPECTED_SSH_USER: "root"
      EXPECTED_APP_DIR: "/opt/deltagrid"
      EXPECTED_DEPLOY_KEY_FINGERPRINT: "SHA256:TYYi5IayfvNvxRGC3K/J637w8rkUw/+5QtyvtUFJGsg"
      SSH_COMMON_OPTIONS: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o NumberOfPasswordPrompts=0 -o TCPKeepAlive=yes -o IPQoS=none"

    steps:
      - name: Evaluate production deploy readiness
        id: deploy_readiness
        run: |
          missing=""
          missing_count=0

          for item in \
            "PROD_SSH_HOST:SSH_HOST" \
            "PROD_SSH_USER:SSH_USER" \
            "PROD_SSH_KEY:SSH_KEY" \
            "PROD_APP_DIR:APP_DIR"
          do
            secret_name="${item%%:*}"
            env_name="${item##*:}"
            if [ -n "${!env_name}" ]; then
              echo "$secret_name configured"
            else
              echo "::warning::$secret_name missing"
              if [ -z "$missing" ]; then
                missing="$secret_name"
              else
                missing="$missing,$secret_name"
              fi
              missing_count=$((missing_count + 1))
            fi
          done

          if [ "$missing_count" -eq 0 ]; then
            deploy_ready="1"
            deploy_result_status="ready_for_real_deploy"
          else
            deploy_ready="0"
            deploy_result_status="skipped_missing_required_secrets"
          fi

          {
            echo "deploy_ready=$deploy_ready"
            echo "deploy_result_status=$deploy_result_status"
            echo "missing_required=$missing"
          } >> "$GITHUB_OUTPUT"

          echo "Production deploy readiness: $deploy_result_status"
          if [ -n "$missing" ]; then
            echo "Missing required production secrets: $missing"
          fi

          {
            echo "### Deploy Production Readiness"
            echo "- status: \`$deploy_result_status\`"
            echo "- deploy_ready: \`$deploy_ready\`"
            echo "- missing_required: \`${missing:-none}\`"
            echo "- expected host: \`$EXPECTED_SSH_HOST\`"
            echo "- expected user: \`$EXPECTED_SSH_USER\`"
            echo "- expected app dir: \`$EXPECTED_APP_DIR\`"
            echo "- expected deploy key fingerprint: \`$EXPECTED_DEPLOY_KEY_FINGERPRINT\`"
            echo "- evidence boundary: \`skipped_missing_required_secrets\` is not a real deploy"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when production secrets are not configured
        if: ${{ steps.deploy_readiness.outputs.deploy_ready != '1' }}
        run: |
          echo "Production deploy result: ${{ steps.deploy_readiness.outputs.deploy_result_status }}"
          {
            echo "### Deploy Production Result"
            echo "- result: \`${{ steps.deploy_readiness.outputs.deploy_result_status }}\`"
            echo "- deploy method: \`none\`"
            echo "- real deploy performed: \`false\`"
            echo "- missing required secrets: \`${{ steps.deploy_readiness.outputs.missing_required }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure SSH
        if: ${{ steps.deploy_readiness.outputs.deploy_ready == '1' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deltagrid_prod_key
          chmod 600 ~/.ssh/deltagrid_prod_key
          ssh-keyscan -T 20 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Validate production deploy key fingerprint
        if: ${{ steps.deploy_readiness.outputs.deploy_ready == '1' }}
        run: |
          ssh-keygen -y -f ~/.ssh/deltagrid_prod_key > ~/.ssh/deltagrid_prod_key.pub
          actual="$(ssh-keygen -lf ~/.ssh/deltagrid_prod_key.pub | awk '{print $2}')"
          expected="$EXPECTED_DEPLOY_KEY_FINGERPRINT"
          test "$actual" = "$expected"
          echo "Production deploy key fingerprint matches expected value"

      - name: Validate production target values
        if: ${{ steps.deploy_readiness.outputs.deploy_ready == '1' }}
        run: |
          if [ "$SSH_HOST" != "$EXPECTED_SSH_HOST" ]; then
            echo "::error::PROD_SSH_HOST does not match the expected production host"
            exit 1
          fi
          if [ "$SSH_USER" != "$EXPECTED_SSH_USER" ]; then
            echo "::error::PROD_SSH_USER does not match the expected production user"
            exit 1
          fi
          if [ "$APP_DIR" != "$EXPECTED_APP_DIR" ]; then
            echo "::error::PROD_APP_DIR does not match the expected production app dir"
            exit 1
          fi
          echo "Production target matches expected host, user and app dir"

      - name: Check production SSH port
        if: ${{ steps.deploy_readiness.outputs.deploy_ready == '1' }}
        run: |
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$SSH_HOST/22"; then
            echo "SSH port 22 is reachable"
          else
            echo "::warning::SSH port 22 probe failed; continuing to the SSH login check"
          fi

      - name: Test production SSH login
        if: ${{ steps.deploy_readiness.outputs.deploy_ready == '1' }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Production SSH login attempt $attempt"
            if timeout 45 ssh -i ~/.ssh/deltagrid_prod_key $SSH_COMMON_OPTIONS "$SSH_USER@$SSH_HOST" "echo production ssh ok && date -u"; then
              exit 0
            fi
            echo "::warning::Production SSH login failed on attempt $attempt"
            sleep $((attempt * 15))
          done
          echo "::warning::Production SSH login diagnostic failed after retries; deploy step remains the gating SSH command"
          exit 0

      - name: Check production app directory
        if: ${{ steps.deploy_readiness.outputs.deploy_ready == '1' }}
        run: |
          for attempt in 1 2 3; do
            echo "Production app directory check attempt $attempt"
            if timeout 60 ssh -i ~/.ssh/deltagrid_prod_key $SSH_COMMON_OPTIONS "$SSH_USER@$SSH_HOST" "
              set -e
              test -d '$APP_DIR'
              cd '$APP_DIR'
              test -f scripts/deploy-compose-stack.sh
              git status --short --branch
            "; then
              exit 0
            fi
            echo "::warning::Production app directory check failed on attempt $attempt"
            sleep $((attempt * 15))
          done
          echo "::warning::Production app directory diagnostic failed after retries; deploy step remains the gating check"
          exit 0

      - name: Deploy production
        if: ${{ steps.deploy_readiness.outputs.deploy_ready == '1' }}
        run: |
          remote_diagnostic() {
            reason="$1"
            echo "::group::Production remote diagnostic: $reason"
            if timeout 60 ssh -i ~/.ssh/deltagrid_prod_key $SSH_COMMON_OPTIONS "$SSH_USER@$SSH_HOST" "
              set +e
              echo 'remote utc:' \$(date -u)
              echo 'app dir: $APP_DIR'
              cd '$APP_DIR' || exit 0
              echo 'git status:'
              git status --short --branch || true
              git --no-pager log -1 --oneline || true
              echo 'disk:'
              df -h . || true
              echo 'compose ps:'
              ENV_FILE='${APP_ENV_FILE:-.env.production}' docker compose -p '${COMPOSE_PROJECT_NAME:-deltagrid}' --env-file '${APP_ENV_FILE:-.env.production}' -f docker-compose.prod.yml ps || true
              echo 'recent app logs:'
              ENV_FILE='${APP_ENV_FILE:-.env.production}' docker compose -p '${COMPOSE_PROJECT_NAME:-deltagrid}' --env-file '${APP_ENV_FILE:-.env.production}' -f docker-compose.prod.yml logs --tail=30 backend frontend || true
            "; then
              echo "Production remote diagnostic completed"
            else
              echo "::warning::Production remote diagnostic unavailable; likely SSH transport/reachability failed"
            fi
            echo "::endgroup::"
          }

          for attempt in 1 2 3; do
            echo "::group::Production deploy attempt $attempt"
            if timeout 1200 ssh -i ~/.ssh/deltagrid_prod_key $SSH_COMMON_OPTIONS "$SSH_USER@$SSH_HOST" "
              set -e
              cd '$APP_DIR'
              BRANCH=main \
                ENV_FILE='${APP_ENV_FILE:-.env.production}' \
                COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME:-deltagrid}' \
                BASE_URL='${SMOKE_BASE_URL:-http://127.0.0.1:8000}' \
                FRONTEND_URL='${SMOKE_FRONTEND_URL:-http://127.0.0.1:3001}' \
                DEPLOY_METHOD=github_actions_ssh \
                DEPLOY_SUMMARY_OUTPUT=/tmp/deltagrid-deploy-summary.json \
                sh scripts/deploy-compose-stack.sh
              echo 'remote deploy summary json:'
              cat /tmp/deltagrid-deploy-summary.json || true
            "; then
              echo "::endgroup::"
              echo "Production deploy result: real_deploy_succeeded"
              {
                echo "### Deploy Production Result"
                echo "- result: \`real_deploy_succeeded\`"
                echo "- deploy method: \`github_actions_ssh\`"
                echo "- real deploy performed: \`true\`"
                echo "- branch: \`main\`"
                echo "- app dir: \`$EXPECTED_APP_DIR\`"
                echo "- backend smoke URL: \`${SMOKE_BASE_URL:-http://127.0.0.1:8000}\`"
                echo "- frontend smoke URL: \`${SMOKE_FRONTEND_URL:-http://127.0.0.1:3001}\`"
                echo "- deploy summary: \`/tmp/deltagrid-deploy-summary.json\` printed in job log"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            status="$?"
            echo "::endgroup::"
            echo "::warning::Production deploy failed on attempt $attempt with status $status"
            remote_diagnostic "after failed attempt $attempt"
            sleep $((attempt * 30))
          done
          echo "::error::Production deploy failed after 3 attempts"
          {
            echo "### Deploy Production Result"
            echo "- result: \`real_deploy_failed\`"
            echo "- deploy method: \`github_actions_ssh\`"
            echo "- real deploy performed: \`attempted\`"
            echo "- branch: \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
