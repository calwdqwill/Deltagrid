name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    name: Deploy main branch
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      APP_DIR: ${{ secrets.PROD_APP_DIR }}

    steps:
      - name: Skip when production secrets are not configured
        if: ${{ env.SSH_HOST == '' || env.SSH_USER == '' || env.SSH_KEY == '' || env.APP_DIR == '' }}
        run: echo "Production deploy skipped because SSH secrets are not configured."

      - name: Configure SSH
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deltagrid_prod_key
          chmod 600 ~/.ssh/deltagrid_prod_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' && env.APP_DIR != '' }}
        run: |
          ssh -i ~/.ssh/deltagrid_prod_key "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$APP_DIR'
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build backend frontend
            sh scripts/server-smoke.sh
          "
